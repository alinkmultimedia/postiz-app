---
name: "Weekly update of Polish image"

# Every Monday: merge the latest upstream Postiz into our Polish branch
# (only inside the job, nothing is pushed) and publish a fresh :pl image.
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout Polish branch
        uses: actions/checkout@v4
        with:
          ref: feat/polish-translation
          fetch-depth: 0

      - name: Merge latest upstream
        run: |
          git config user.name "partivio-bot"
          git config user.email "bot@partivio.cloud"
          git remote add upstream https://github.com/gitroomhq/postiz-app.git
          git fetch upstream main
          git merge --no-edit upstream/main
          echo "UPSTREAM=$(git rev-parse --short upstream/main)" >> "$GITHUB_ENV"

      - name: Report untranslated keys
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d='libraries/react-shared-libraries/src/translation/locales'
          en=json.load(open(f'{d}/en/translation.json'))
          pl=json.load(open(f'{d}/pl/translation.json'))
          miss=[k for k in en if k not in pl]
          print(f'Upstream {__import__("os").environ["UPSTREAM"]}: {len(miss)} keys without Polish translation')
          for k in miss[:100]: print(f'- `{k}`: {en[k]}')
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        run: |
          IMG=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          DAY=$(date +%Y%m%d)
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=pl-$DAY-$UPSTREAM \
            --provenance=false --sbom=false \
            -t $IMG:pl -t $IMG:pl-$DAY \
            --push .
